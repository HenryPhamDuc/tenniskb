# MkDocs Configuration for TennisKB

site_name: TennisKB
site_description: The Q-V-ROOT-8-45-Impulse-Jin System — Complete Tennis Biomechanics
site_author: Henry Pham Duc
site_url: https://tenniskb.github.io

repo_name: tenniskb/tenniskb.github.io
repo_url: https://github.com/tenniskb/tenniskb.github.io
edit_uri: edit/main/docs/

copyright: © 2025 Henry Pham Duc. All rights reserved.

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - content.action.view

nav:
  - Home: index.md
  - Start Here: start-here.md
  - System:
    - CORE Overview: system/core-overview.md
    - Variables Index: system/index.md
    - Q - Quiet Eye: system/q-quiet-eye.md
    - V - Vestibular: system/v-vestibular.md
    - ROOT - Rooting: system/root-rooting.md
    - F - Fascia: system/f-fascia.md
    - P - Proprioception: system/p-proprioception.md
    - T - Tensegrity: system/t-tensegrity.md
    - SSC - Stretch-Shortening: system/ssc-stretch-shortening.md
    - 8 - Figure-8: system/8-figure8.md
    - 45° - Swing Plane: system/45-swing-plane.md
    - BRAKE - Braking: system/brake-braking.md
    - PULSE - Pulse: system/pulse-impulse.md
    - JIN - Jin/Kinh: system/jin-jinh.md
  - Strokes:
    - Forehand Push: strokes/forehand-push.md
    - 1H Backhand Saber: strokes/backhand-saber.md
    - 2H Backhand Hybrid: strokes/backhand-hybrid.md
    - Serve: strokes/serve.md
    - Return: strokes/return.md
    - Volley & Overhead: strokes/volley-overhead.md
    - Touch Shots: strokes/touch-shots.md
  - Patterns:
    - Singles: patterns/singles.md
    - Doubles: patterns/doubles.md
  - Mental:
    - Pre-Point Routine: mental/routine.md
    - Quiet Eye Under Pressure: mental/pressure.md
    - Visualization: mental/visualization.md
  - Physical:
    - Tennis Fitness: physical/fitness.md
    - Periodization: physical/periodization.md
  - Resources:
    - Visual Library: resources/visual-library.md
    - Diagnostics: resources/diagnostics.md
    - Drills Library: resources/drills.md
    - AI Coach: resources/ai-coach.md
  - About: about.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tenniskb
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/henryphamduc
    - icon: fontawesome/brands/youtube
      link: https://youtube.com/@henryphamduc
  analytics:
    provider: google
    property: G-XXXXXXXXXX
  generator: false

plugins:
  - search
  - minify:
      minify_html: true